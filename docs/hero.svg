<path d="M400.000,420.000 L460.000,350.000 Q540.000,300.000 600.000,360.000 L660.000,330.000 L660.000,420.000 Z" fill="none" stroke="#327850" stroke-width="2.000" stroke-linecap="round" stroke-linejoin="round"/>
