<ellipse cx="300" cy="150" rx="90" ry="45" fill="#2864c8" fill-opacity="0.235"/>
<ellipse cx="300" cy="150" rx="90" ry="45" fill="none" stroke="#2864c8" stroke-width="1"/>
<circle cx="240" cy="130" r="5" fill="#2864c8" fill-opacity="0.863"/>
<circle cx="260" cy="143" r="5" fill="#2864c8" fill-opacity="0.863"/>
<circle cx="280" cy="156" r="5" fill="#2864c8" fill-opacity="0.863"/>
