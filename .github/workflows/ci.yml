name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    # Mojo compiles here are heavy (some individual test/example files
    # take several minutes) -- generous timeout rather than a flaky
    # default.
    timeout-minutes: 60
    steps:
      # v7 specifically, not just "latest v4" -- v4 is built against
      # Node.js 20, which GitHub Actions runners now force onto Node 24
      # instead (a real, visible "Node.js 20 is deprecated" annotation
      # on every run otherwise, confirmed on this repo's own CI: see
      # https://github.blog/changelog/2025-09-19-deprecation-of-node-20-on-github-actions-runners/).
      # v7 is built against Node 24 natively, no forced-compat warning.
      - uses: actions/checkout@v7

      # canvas_mojo/text/font_discovery.mojo links directly against
      # libfontconfig at runtime -- not bundled, not a pixi dependency
      # of this workspace, installed here explicitly rather than
      # assumed present on the runner image. Font *parsing* itself
      # (canvas_mojo/text/ttf.mojo) is native Mojo, no linked library
      # at all -- libfreetype was the other direct FFI dependency here
      # until it was replaced by that native TrueType parser; only
      # fontconfig (font *discovery* -- resolving a family name to an
      # actual installed file) remains linked, a deliberately different
      # call than the one made for FreeType, see ttf.mojo's own module
      # docstring for why. Not part of a stock macOS install the way
      # it's part of a stock Linux desktop install (macOS has its own
      # native Core Text font stack) -- Homebrew is the standard way to
      # get it there, the same "system library, not bundled by this
      # package" story as Linux's apt packages, just a different
      # package manager.
      #
      # fonts-ubuntu/fonts-dejavu-core (and their Homebrew-cask
      # equivalents below) are a real test dependency, not a cosmetic
      # extra: test_font_discovery.mojo's char-constrained-resolution
      # tests (tests/test_font_discovery.mojo) hard-code
      # "the 'Ubuntu' font lacks a snowman glyph (U+2603) that 'DejaVu
      # Sans' has" as their real, contrasting fallback case -- true on
      # a desktop Ubuntu install (where that assumption was originally
      # probe-confirmed), but not on a bare runner image, which ships
      # libfontconfig (the *library*) without any actual font files.
      # Without these packages, `resolve_font_file("Ubuntu")` silently
      # falls back to whatever default font fontconfig substitutes
      # instead, collapsing the "falls back to a *different* font"
      # assertion the test depends on -- confirmed as the exact, sole
      # cause of a real CI failure (run 31965206350) on Linux before
      # that fix landed, not a guess.
      #
      # fonts-urw-base35 (font-urw-base35 on macOS) is a real,
      # genuinely CFF/OpenType-CFF font family (confirmed by reading
      # its own sfntVersion field directly -- 'OTTO', not guessed at)
      # -- tests/test_ttf.mojo's own CFF-rejection test resolves
      # "Nimbus Sans" from it via fontconfig, the same real font this
      # was developed and verified against, not a synthetic stand-in.
      - name: Install libfontconfig and test fonts (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libfontconfig1 fonts-ubuntu fonts-dejavu-core fonts-urw-base35

      - name: Install libfontconfig and test fonts (macOS)
        if: runner.os == 'macOS'
        run: brew install fontconfig && brew install --cask font-ubuntu font-dejavu font-urw-base35 && fc-cache -f

      # Pinned to match the pixi version pixi.lock (v7 format) was
      # generated with locally -- an older pixi here would just hit the
      # same "lock file uses an older format" warning in reverse (or
      # worse, fail to read a v7 lock file at all).
      - uses: prefix-dev/setup-pixi@v0.9.0
        with:
          pixi-version: v0.76.2
          cache: true

      - name: Run tests
        run: pixi run test

      - name: Run examples
        run: pixi run example
