name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    # Mojo compiles are heavy here; some files take several minutes.
    timeout-minutes: 60
    steps:
      # v7, not v4: v4 runs on Node 20, which the runners now force
      # onto Node 24 with a deprecation annotation on every run.
      - uses: actions/checkout@v7

      # Font files only -- this package links no library. But the
      # tests need real fonts installed, and a bare runner ships almost
      # none:
      #
      # - fonts-ubuntu + fonts-dejavu-core: test_font_discovery.mojo's
      #   fallback tests rely on 'Ubuntu' lacking a snowman glyph
      #   (U+2603) that 'DejaVu Sans' has. Without both, the "falls
      #   back to a *different* font" assertion collapses -- this was
      #   a real CI failure. DejaVu also heads the default sans list.
      # - fonts-urw-base35: a genuine OpenType-CFF family ('OTTO'
      #   sfntVersion), which test_ttf.mojo's CFF-rejection test
      #   resolves "Nimbus Sans" from.
      - name: Install test fonts (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y fonts-ubuntu fonts-dejavu-core fonts-urw-base35 fonts-noto-color-emoji

      # No `fc-cache`: nothing reads fontconfig's cache, and the casks
      # drop files into ~/Library/Fonts, which font_discovery scans.
      - name: Install test fonts (macOS)
        if: runner.os == 'macOS'
        run: brew install --cask font-ubuntu font-dejavu font-urw-base35

      # Pinned, and at least 0.77.0: pixi-build-mojo 0.2.6 and later,
      # the versions that package with `mojo precompile`, need
      # pixi-build-api-version 7, which arrived in pixi 0.77.0. Under
      # an older pixi the backend floor in pixi.toml is unsatisfiable
      # (dataviz_mojo#603). v0.78.0 is the version this was verified
      # on, not the newest. It also reads pixi.lock's v7 format.
      - name: Install pixi and the root environment
        uses: prefix-dev/setup-pixi@v0.9.0
        with:
          pixi-version: v0.78.0
          cache: true

      - name: Run tests
        run: pixi run test

      - name: Run examples
        run: pixi run example

  # Builds canvas_mojo as a package and imports it from a separate
  # workspace -- the install path README.md documents, and the one
  # nothing else covers. `pixi run test` and `pixi run example` both
  # run under `-I .`, which resolves canvas/ as a source directory:
  # the [package] section, the pixi-build-mojo backend and the built
  # artifact's contents are all invisible to them, so a packaging
  # break reaches users with every existing check green.
  #
  # Its own job rather than a step on `test`: it needs no fonts and a
  # far shorter timeout, and running alongside keeps it off the
  # critical path.
  package:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    # Building the package is quick; installing a second Mojo toolchain
    # for the consumer workspace is what this spends its time on.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Install pixi only, uncached
        uses: prefix-dev/setup-pixi@v0.9.0
        with:
          pixi-version: v0.78.0
          # No caching here, unlike the test job. pixi will reuse a
          # previously built package when only the root manifest's
          # [package] section changed -- a source edit under canvas/
          # does force a rebuild, but a packaging change may not -- so
          # a restored cache could let this job pass against an
          # artifact built from different packaging settings. A fresh
          # build every run is the whole point of the job.
          cache: false
          # The environment under test is tests/consumer's, which the
          # run step below installs on demand. The root workspace's is
          # not needed.
          run-install: false

      # One step, not two: the backend builds on the first `pixi run`
      # in the consumer workspace, so a later step would have no build
      # output to read.
      - name: Build the package, import it from a separate workspace, and check how it was packaged
        run: |
          set -o pipefail
          pixi run --manifest-path tests/consumer/pixi.toml smoke 2>&1 | tee build.log
          # pixi-build-mojo below 0.2.6 packages with `mojo package` into
          # a .mojopkg and warns twice while doing it. Those warnings are
          # the only symptom of the backend falling back, so without this
          # nothing fails when it does.
          grep -q "mojo precompile" build.log || {
            echo "the backend did not use 'mojo precompile': it resolved an"
            echo "older pixi-build-mojo than pixi.toml asks for. Check that"
            echo "the pixi-version above is new enough for the backend's"
            echo "pixi-build-api-version (7 needs pixi 0.77.0 or later)."
            exit 1
          }
          if grep -qE "'package' is deprecated|'\.mojopkg' file extensions is deprecated" build.log; then
            echo "the packaging deprecation warnings are back:"
            grep -E "deprecated" build.log
            exit 1
          fi
          echo "packaged with precompile, no packaging deprecation warnings"
