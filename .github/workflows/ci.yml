name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    # Mojo compiles here are heavy (some individual test/example files
    # take several minutes) -- generous timeout rather than a flaky
    # default.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      # canvas_mojo/text.mojo links directly against libfontconfig
      # (font_discovery.mojo) and libfreetype (freetype_face.mojo/
      # glyph_outline.mojo) at runtime -- not bundled, not a pixi
      # dependency of this workspace, installed here explicitly rather
      # than assumed present on the runner image.
      #
      # fonts-ubuntu is a real test dependency, not a cosmetic extra:
      # test_font_discovery.mojo's char-constrained-resolution tests
      # (canvas_mojo/tests/test_font_discovery.mojo) hard-code "the
      # 'Ubuntu' font lacks a snowman glyph (U+2603) that 'DejaVu Sans'
      # has" as their real, contrasting fallback case -- true on a
      # desktop Ubuntu install (where that assumption was originally
      # probe-confirmed), but not on this bare runner image, which
      # ships libfontconfig/libfreetype (the *libraries*) without any
      # actual "Ubuntu"-family font file. Without this package,
      # `resolve_font_file("Ubuntu")` silently falls back to whatever
      # default font fontconfig substitutes instead, collapsing the
      # "falls back to a *different* font" assertion the test depends
      # on -- confirmed as the exact, sole cause of a real CI failure
      # (run 31965206350) before this fix, not a guess.
      - name: Install libfontconfig, libfreetype, and test fonts
        run: sudo apt-get update && sudo apt-get install -y libfontconfig1 libfreetype6 fonts-ubuntu fonts-dejavu-core

      # Pinned to match the pixi version pixi.lock (v7 format) was
      # generated with locally -- an older pixi here would just hit the
      # same "lock file uses an older format" warning in reverse (or
      # worse, fail to read a v7 lock file at all).
      - uses: prefix-dev/setup-pixi@v0.9.0
        with:
          pixi-version: v0.76.2
          cache: true

      - name: Run tests
        run: pixi run test

      - name: Run examples
        run: pixi run example
