name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    # Mojo compiles are heavy here; some files take several minutes.
    timeout-minutes: 60
    steps:
      # v7, not v4: v4 runs on Node 20, which the runners now force
      # onto Node 24 with a deprecation annotation on every run.
      - uses: actions/checkout@v7

      # Font files only -- this package links no library. But the
      # tests need real fonts installed, and a bare runner ships almost
      # none:
      #
      # - fonts-ubuntu + fonts-dejavu-core: test_font_discovery.mojo's
      #   fallback tests rely on 'Ubuntu' lacking a snowman glyph
      #   (U+2603) that 'DejaVu Sans' has. Without both, the "falls
      #   back to a *different* font" assertion collapses -- this was
      #   a real CI failure. DejaVu also heads the default sans list.
      # - fonts-urw-base35: a genuine OpenType-CFF family ('OTTO'
      #   sfntVersion), which test_ttf.mojo's CFF-rejection test
      #   resolves "Nimbus Sans" from.
      - name: Install test fonts (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y fonts-ubuntu fonts-dejavu-core fonts-urw-base35

      # No `fc-cache`: nothing reads fontconfig's cache, and the casks
      # drop files into ~/Library/Fonts, which font_discovery scans.
      - name: Install test fonts (macOS)
        if: runner.os == 'macOS'
        run: brew install --cask font-ubuntu font-dejavu font-urw-base35

      # Pinned to the pixi version pixi.lock (v7 format) was generated
      # with; an older pixi may not read a v7 lock file at all.
      - uses: prefix-dev/setup-pixi@v0.9.0
        with:
          pixi-version: v0.76.2
          cache: true

      - name: Run tests
        run: pixi run test

      - name: Run examples
        run: pixi run example
