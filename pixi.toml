[workspace]
channels = ["https://conda.modular.com/max", "conda-forge"]
name = "canvas_mojo"
platforms = ["linux-64", "osx-arm64"]
preview = ["pixi-build"]
version = "0.15.0"

[dependencies]
mojo = ">=1.0.0,<2"

# hugo and go serve only the docs tasks, so they sit in their own
# feature: installing the default environment for `test`/`example`
# does not pull them, and `pixi run docs` selects the `docs`
# environment (default feature plus this one) that does.
[feature.docs.dependencies]
hugo = ">=0.164.0,<0.165"
go = ">=1.26.6,<2"

[environments]
docs = ["docs"]

[tasks]
# Both tasks run every file in parallel (scripts/run_parallel.sh).
# Safe because files write to disjoint output paths.
#
# `test`'s order is not alphabetical: the font/glyph-heavy files run
# first so they occupy CPU slots from the start -- longest-job-first,
# which matters on a CPU-constrained CI runner.
example = "bash scripts/run_parallel.sh examples/fill_rect_blend.mojo examples/blend_modes.mojo examples/rect_stroke.mojo examples/lines.mojo examples/circles.mojo examples/ellipse.mojo examples/arc.mojo examples/polyline.mojo examples/polygon.mojo examples/path.mojo examples/fill_rule.mojo examples/gradient.mojo examples/conic_gradient.mojo examples/patterns.mojo examples/dashes.mojo examples/transform.mojo examples/canvas_state.mojo examples/clipping.mojo examples/png_output.mojo examples/text.mojo examples/vector.mojo examples/transparency.mojo examples/layers.mojo examples/clip_path.mojo examples/joins.mojo"
test = "bash scripts/run_parallel.sh tests/test_text.mojo tests/test_canvas_transform.mojo tests/test_font_discovery.mojo tests/test_font_cache.mojo tests/test_ttf.mojo tests/test_glyph_outline.mojo tests/test_color.mojo tests/test_buffer.mojo tests/test_bmp.mojo tests/test_deflate.mojo tests/test_png.mojo tests/test_geometry.mojo tests/test_aa_area.mojo tests/test_gradient.mojo tests/test_pattern.mojo tests/test_dash.mojo tests/test_lines.mojo tests/test_polygon_fill.mojo tests/test_rects.mojo tests/test_circles.mojo tests/test_ellipses.mojo tests/test_arcs.mojo tests/test_path.mojo tests/test_subpixel_api.mojo tests/test_alpha.mojo tests/test_blend.mojo tests/test_compose.mojo tests/test_clip_path.mojo tests/test_golden.mojo tests/test_line_cap.mojo tests/test_line_join.mojo tests/test_resize.mojo tests/test_svg.mojo tests/test_bidi.mojo tests/test_package_exports.mojo"

# Times the drawing primitives (us/iter). One file, so one compile.
# Not wired into CI: a shared runner's timings vary too much to gate
# on. Run it before and after a change. See the file's own docstring
# for what the numbers do and don't mean.
bench = "mojo run -I . benchmarks/bench_canvas.mojo"

# `mojo format`'s default 80 columns rather than a custom `-l`, so a
# bare `mojo format` (or format-on-save) is always correct here.
# format.yml also runs this on every PR and commits the result back.
fmt = "mojo format canvas/ tests/ examples/ scripts/"

# The docs tasks live on the `docs` feature, so `pixi run docs` runs in
# the environment that has hugo/go without anyone naming it.
[feature.docs.tasks]
# Regenerates docs/site/content. Nothing this produces is committed;
# .gitignore lists what is generated and what is real source.
#
# Requires `pixi run example` to have run at least once -- this copies
# those output images rather than re-rendering them.
#
# The trailing `sed` pins modo's generated canvas/_index.md to
# weight 150. modo always emits 400 for a package root, with no config
# flag to change it, which sorted API reference after Examples
# (weight 200) in Hextra's sidebar.
docs-install = "bash scripts/install-modo.sh"
docs-build = { cmd = "rm -rf docs/site/content docs/site/public docs/src/examples && mkdir -p docs/src/examples && mojo run -I . scripts/gen_example_docs.mojo && cp examples/out_*.png docs/src/examples/ && cp examples/out_vector.svg docs/src/examples/ && mojo doc -I . -o docs/src/canvas.json canvas && .tools/modo build docs -c modo.yaml && sed -i 's/^weight: 400$/weight: 150/' docs/site/content/canvas/_index.md", depends-on = [
    "docs-install",
] }
# One-shot build into docs/site/public, what docs-deploy.yml deploys.
docs = { cmd = "hugo -s docs/site", depends-on = ["docs-build"] }
# Live preview at http://localhost:1313/canvas_mojo/. Edits under
# docs/site/content rebuild automatically, but docs-build's steps
# (mojo doc, gen_example_docs.mojo, modo build) do not -- re-run this
# task after changing docstrings or examples.
docs-serve = { cmd = "hugo server -s docs/site", depends-on = ["docs-build"] }

# --- Package declaration -----------------------------------------------
# `tests/` and `examples/` are siblings of `canvas/`, not nested in it:
# `mojo package` refuses a package directory containing a `main()`
# ("'main()' is not supported within packages"), and every file there
# has one. `-I .` still resolves `from canvas.X import Y`.
#
# `[package]` keeps the project name, "canvas_mojo"; only the
# importable package (the `canvas/` dir) is named just "canvas".
[package]
name = "canvas_mojo"
version = "0.15.0"
description = "A from-scratch, stdlib-only Mojo raster/drawing engine: pixel buffer, colors, primitives, text, image I/O."
license = "MIT"

[package.build]
backend = { name = "pixi-build-mojo", version = "0.*" }
source = { path = "." }

[package.build.config.pkg]
name = "canvas"
path = "canvas"

[package.host-dependencies]
mojo = ">=1.0.0,<2"

[package.run-dependencies]
mojo = ">=1.0.0,<2"
